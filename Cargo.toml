[package]
name = "vigia"
version = "0.1.0"
edition = "2024"
description = "Self-hosted web page change monitor: price, stock and text, with REST API, webhooks and MCP"
license = "MIT"
repository = "https://github.com/elpablazo/vigia"
publish = false

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli", "json", "http2"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
