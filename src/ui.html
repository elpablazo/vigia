<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigía">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Vigía</title>
<style>
:root {
  --bg: #f6f6f4; --surface: #fff; --raised: #f1f1ee; --text: #18181b; --muted: #6b6b73; --faint: #a1a1aa;
  --border: #e6e5e1; --border-strong: #d4d4d0; --primary: #18181b; --on-primary: #fff;
  --good: #0a8f5f; --good-bg: #e3f6ed; --bad: #c8322b; --bad-bg: #fde9e7; --warn: #a15c00; --warn-bg: #fdf0d5;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e; --surface: #151518; --raised: #1c1c20; --text: #ececee; --muted: #9a9aa3; --faint: #5f5f67;
    --border: #25252a; --border-strong: #34343b; --primary: #ececee; --on-primary: #111;
    --good: #3ecf8e; --good-bg: #10291f; --bad: #ff7b72; --bad-bg: #331616; --warn: #f0b354; --warn-bg: #2e2210;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
code { font: .9em var(--mono); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 14px calc(40px + var(--safe-b)); }

/* ---------- top bar */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px; padding: calc(10px + var(--safe-t)) 14px 10px; margin: 0 -14px 6px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 680; font-size: 19px; letter-spacing: -.02em; margin-right: auto; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--muted); flex: none; }
.icon-btn:active, .icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .badge-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); border: 2px solid var(--bg); }
.text-btn { height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 99px; background: var(--surface); font-size: 14px; font-weight: 560; }

/* ---------- add */
.add { display: flex; align-items: flex-end; gap: 8px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.add textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 160px; padding: 11px 10px; border: 0; background: none; font-size: 16px; line-height: 22px; outline: none; resize: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); font-weight: 580; font-size: 15px; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.add-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 2px 0; }
.add-opts .field:last-child { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 11px; background: var(--surface); font-size: 16px; color: var(--text); }
.field textarea { padding: 10px 12px; min-height: 76px; resize: vertical; }
.link-btn { border: 0; background: none; padding: 8px 2px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- filters */
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -14px 10px; padding: 2px 14px; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 99px; background: var(--surface); font-size: 14px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip b { font-weight: 650; margin-left: 5px; opacity: .75; }
.search { flex: 0 0 150px; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 99px; background: var(--surface); font-size: 14px; outline: none; }

/* ---------- list */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; text-align: left; width: 100%; }
.row:active { background: var(--raised); }
.row.paused { opacity: .6; }
.thumb { position: relative; width: 52px; height: 52px; border-radius: 12px; background: var(--raised); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 650; color: var(--muted); overflow: hidden; text-transform: uppercase; flex: none; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.name { font-weight: 580; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.meta span { overflow: hidden; text-overflow: ellipsis; }
.meta .host { flex: none; max-width: 55%; }
.why { font-size: 12.5px; margin-top: 3px; line-height: 1.35; }
.why.blocked { color: var(--warn); } .why.error { color: var(--bad); }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--raised); color: var(--muted); flex: none; }
.val { text-align: right; }
.price { font-weight: 680; font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.price small { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 2px; }
.sub { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 12px; margin-top: 3px; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 620; white-space: nowrap; }
.badge.good { background: var(--good-bg); color: var(--good); } .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.plain { background: var(--raised); color: var(--muted); }
.delta { font-variant-numeric: tabular-nums; font-weight: 650; } .delta.down { color: var(--good); } .delta.up { color: var(--bad); }
.spark { display: none; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; border: 1px dashed var(--border-strong); border-radius: 16px; }
.spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

/* ---------- sheets */
dialog { border: 0; background: var(--bg); color: var(--text); padding: 0; margin: 0; width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog[open] { animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(12px); } }
.d-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: calc(6px + var(--safe-t)) 8px 6px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.d-head h2 { margin: 0; font-size: 16px; font-weight: 620; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-body { padding: 16px 14px calc(48px + var(--safe-b)); max-width: 720px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.card > h3 { margin: 0 0 10px; font-size: 13px; font-weight: 640; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.hero { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.hero .thumb { width: 64px; height: 64px; border-radius: 14px; font-size: 22px; }
.hero h1 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
.hero a { color: var(--muted); font-size: 13px; word-break: break-all; text-decoration: none; }
.big { font-size: 34px; font-weight: 720; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.actions .btn.primary { grid-column: 1 / -1; }

/* chart */
.ranges { display: flex; gap: 4px; padding: 3px; background: var(--raised); border-radius: 11px; margin-bottom: 10px; }
.ranges button { flex: 1; height: 34px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.ranges button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.chart-box { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart-box svg { display: block; width: 100%; overflow: visible; }
.chart-box text { font: 11px system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 0; pointer-events: none; padding: 7px 10px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.35; white-space: nowrap; box-shadow: var(--shadow); transform: translateX(-50%); }
.tip b { font-size: 15px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.stat { padding: 10px 12px; border-radius: 12px; background: var(--raised); }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat i { font-style: normal; font-size: 12px; color: var(--muted); }

/* notify */
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: 15px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.opt input[type=radio] { width: 20px; height: 20px; margin: 0; accent-color: var(--text); flex: none; }
.opt input[type=text] { width: 110px; min-height: 36px; margin-left: auto; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); font-size: 16px; }
.hint { color: var(--muted); font-size: 13.5px; margin: 4px 0 10px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist td { padding: 10px 2px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: middle; }
.hist tr:first-child td { border-top: 0; }
.hist td:last-child { text-align: right; }
.hist .when { color: var(--muted); font-size: 13px; }
.diff { margin: 6px 0; border: 1px solid var(--border); border-radius: 10px; font: 12.5px/1.5 var(--mono); max-height: 360px; overflow: auto; }
.diff div { padding: 1px 10px; white-space: pre-wrap; word-break: break-word; }
.diff .add { background: var(--good-bg); color: var(--good); } .diff .del { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.diff .gap { color: var(--faint); text-align: center; }
pre.code { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 14.5px; margin-bottom: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); }

.login { max-width: 360px; margin: 0 auto; padding: calc(18vh + var(--safe-t)) 20px 0; text-align: center; }
.login .brand { justify-content: center; margin: 0 0 22px; font-size: 24px; }
.login .brand img { width: 40px; height: 40px; border-radius: 10px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login input { min-height: 50px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 13px; background: var(--surface); font-size: 16px; text-align: center; }
#toast { position: fixed; left: 50%; bottom: calc(20px + var(--safe-b)); translate: -50% 0; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 13px; font-size: 14.5px; box-shadow: var(--shadow); width: max-content; max-width: calc(100vw - 28px); z-index: 99; opacity: 0; pointer-events: none; transition: opacity .15s; }
#toast.show { opacity: 1; }

/* ---------- wider screens */
@media (min-width: 720px) {
  .wrap { padding: 0 24px 60px; }
  .bar { margin: 0 -24px 10px; padding: 18px 24px 14px; }
  .filters { margin: 14px 0 12px; padding: 2px 0; flex-wrap: wrap; overflow: visible; }
  .row { grid-template-columns: 52px minmax(0, 1fr) 110px auto; padding: 12px 14px 12px 12px; }
  .row:hover { border-color: var(--border-strong); }
  .spark { display: block; width: 110px; height: 34px; }
  .add-opts { grid-template-columns: 1fr 1fr 2fr; }
  .add-opts .field:last-child { grid-column: auto; }
  dialog.sheet { margin: 0 0 0 auto; width: min(620px, 100vw); border-left: 1px solid var(--border); }
  dialog.modal { margin: auto; width: min(600px, calc(100vw - 32px)); height: auto; max-height: calc(100dvh - 48px); border-radius: 20px; border: 1px solid var(--border); }
  .actions { grid-template-columns: auto auto 1fr; }
  .actions .btn.primary { grid-column: auto; }
  .actions .danger { justify-self: end; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .grid2 { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="brand"><img src="/icon-192.png" alt="">Vigía</div>
  <form id="login-form">
    <input id="login-token" type="password" autocomplete="current-password" placeholder="Token de acceso" aria-label="Token de acceso" required>
    <button class="btn primary">Entrar</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <div class="bar">
    <div class="brand"><img src="/icon-192.png" alt="">Vigía</div>
    <button class="text-btn" id="install" hidden>Instalar</button>
    <button class="icon-btn" id="bell" aria-label="Avisos en este dispositivo" title="Avisos en este dispositivo"></button>
    <button class="icon-btn" id="open-settings" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </div>

  <form class="add" id="add-form">
    <textarea id="add-url" rows="1" inputmode="url" placeholder="Pega una o varias URLs" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="URLs a vigilar" required></textarea>
    <button class="btn primary" id="add-btn">Vigilar</button>
  </form>
  <div class="add-opts" id="add-more" hidden>
    <label class="field">Revisar cada <select id="add-interval"></select></label>
    <label class="field">Etiqueta <input id="add-tag" type="text" placeholder="opcional" maxlength="40"></label>
    <label class="field">Sólo esta parte (selector CSS) <input id="add-selector" type="text" placeholder="opcional, p. ej. #precio" spellcheck="false" autocapitalize="off"></label>
  </div>
  <button class="link-btn" id="toggle-more" type="button">Opciones al agregar</button>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<dialog class="sheet" id="detail"><div class="d-head"><button class="icon-btn" data-close aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="detail-title"></h2></div><div class="d-body" id="detail-body"></div></dialog>
<dialog class="modal" id="settings"><div class="d-head"><button class="icon-btn" data-close aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Ajustes</h2></div><div class="d-body" id="settings-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const INTERVALS = [[300, '5 minutos'], [900, '15 minutos'], [3600, '1 hora'], [21600, '6 horas'], [43200, '12 horas'], [86400, '24 horas']];
const VIA = { relay: 'vía relevo', agent: 'vía agente' };
const RANGES = [['d7', '7D', 7], ['d30', '1M', 30], ['d90', '3M', 90], ['d365', '1A', 365], ['all', 'Todo', 0]];
const ICON = {
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>',
  bellOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21 21 0 0 0 .6 5M17 17H3s3-2 3-9a5.9 5.9 0 0 1 .3-1.9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0M3 3l18 18"/></svg>',
};
let watches = [], filter = 'all', query = '', openId = null, openWatch = null, range = 'all', busy = new Set(), status = {}, installPrompt = null;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3400); }

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { ...opts, headers: opts.body ? { 'content-type': 'application/json' } : {}, body: opts.body && JSON.stringify(opts.body) });
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('Sesión cerrada'); }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || `Error ${r.status}`);
  return data;
}

// ---------- formatting
const rtf = new Intl.RelativeTimeFormat('es-MX', { numeric: 'auto', style: 'short' });
function ago(ts) {
  if (!ts) return 'nunca';
  const s = Math.round(Date.now() / 1000 - ts);
  if (s < 45) return 'hace un momento';
  if (s < 3600) return rtf.format(-Math.round(s / 60), 'minute');
  if (s < 86400) return rtf.format(-Math.round(s / 3600), 'hour');
  return rtf.format(-Math.round(s / 86400), 'day');
}
const fmtDate = (ts, o) => new Date(ts * 1000).toLocaleString('es-MX', o);
const when = ts => fmtDate(ts, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const day = ts => fmtDate(ts, { day: 'numeric', month: 'short', year: '2-digit' });

const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

// ---------- small sparkline for the list
function spark(points, w, h) {
  if (points.length < 2) return '';
  const pts = [...points, [Date.now() / 1000, points.at(-1)[1]]];
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [xs[0], Math.max(xs.at(-1), xs[0] + 1), Math.min(...ys), Math.max(...ys)];
  const X = x => 2 + (x - x0) / (x1 - x0) * (w - 4), Y = y => y1 === y0 ? h / 2 : 3 + (y1 - y) / (y1 - y0) * (h - 6);
  let d = `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += ` H${X(pts[i][0]).toFixed(1)} V${Y(pts[i][1]).toFixed(1)}`;
  const c = ys.at(-1) < ys[0] ? 'var(--good)' : ys.at(-1) > ys[0] ? 'var(--bad)' : 'var(--faint)';
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/>`;
}

// ---------- detailed price chart: axes, out-of-stock bands, scrubbing tooltip
function niceTicks(lo, hi, want) {
  if (hi === lo) { const pad = Math.abs(hi) * .05 || 1; lo -= pad; hi += pad; }
  const raw = (hi - lo) / want, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;

  return { ticks, step };
}
const DAY = 86400;
function timeTicks(t0, t1, want) {
  const span = t1 - t0;
  const steps = [[DAY, 'd'], [2 * DAY, 'd'], [7 * DAY, 'd'], [14 * DAY, 'd'], [30 * DAY, 'm'], [91 * DAY, 'm'], [182 * DAY, 'm'], [365 * DAY, 'y']];
  const [step, unit] = steps.find(s => span / s[0] <= want + 1) || steps.at(-1);
  const ticks = [];
  const d = new Date(t0 * 1000); d.setHours(0, 0, 0, 0);
  if (unit !== 'd') d.setDate(1);

  const months = Math.round(step / (30 * DAY));
  while (d.getTime() / 1000 <= t1) {
    const t = d.getTime() / 1000;
    if (t >= t0) ticks.push(t);
    if (unit === 'd') d.setDate(d.getDate() + step / DAY);

  return ticks.map(t => [t, fmtDate(t, fmt).replace('.', '')]);
}
function drawChart(box, all, days, cur) {
  const W = Math.max(box.clientWidth, 260), H = 230, L = 6, R = 62, T = 14, B = 26;
  const nowT = Date.now() / 1000;
  const from = days ? Math.max(nowT - days * DAY, all[0][0]) : all[0][0];
  const before = all.findLastIndex(p => p[0] <= from);
  const pts = (before >= 0 ? [[from, all[before][1], all[before][2]], ...all.slice(before + 1)] : all.slice()).filter(p => p[0] >= from);
  const series = [...pts, [nowT, pts.at(-1)[1], pts.at(-1)[2]]];
  const t0 = from, t1 = Math.max(nowT, t0 + 3600);
  const prices = series.map(p => p[1]);
  const { ticks, step } = niceTicks(Math.min(...prices), Math.max(...prices), 4);
  const y0 = ticks[0], y1 = ticks.at(-1);
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0 || 1) * (H - T - B);
  const dec = step < 1 ? 2 : 0;

  for (const v of ticks) svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-dasharray="${v === y0 ? '' : '3 4'}"/><text x="${W - R + 8}" y="${Y(v) + 4}">$${num(v, dec)}</text>`;
  for (const [t, label] of timeTicks(t0, t1, Math.max(3, Math.floor((W - L - R) / 60)))) svg += `<line x1="${X(t)}" x2="${X(t)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--border-strong)"/><text x="${X(t)}" y="${H - 7}" text-anchor="middle">${esc(label)}</text>`;
  let d = `M${X(series[0][0]).toFixed(1)} ${Y(series[0][1]).toFixed(1)}`;
  for (let i = 1; i < series.length; i++) d += ` H${X(series[i][0]).toFixed(1)} V${Y(series[i][1]).toFixed(1)}`;
  const first = series[0][1], last = series.at(-1)[1];
  const color = last < first ? 'var(--good)' : last > first ? 'var(--bad)' : 'var(--text)';
  svg += `<path d="${d} V${H - B} H${X(series[0][0]).toFixed(1)} Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (pts.length <= 40) for (const p of pts.slice(1)) svg += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="var(--surface)" stroke="${color}" stroke-width="1.5"/>`;
  svg += `<circle cx="${X(nowT)}" cy="${Y(last)}" r="4" fill="${color}"/>`;
  svg += `<g class="cursor" visibility="hidden"><line y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/><circle r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Historial de precio">${svg}</svg><div class="tip" hidden></div>`;

  const cursor = box.querySelector('.cursor'), tip = box.querySelector('.tip');
  const show = e => {
    const r = box.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, L), W - R);

    const i = series.findLastIndex(p => p[0] <= t);
    const p = series[Math.max(i, 0)], prev = series[Math.max(i - 1, 0)];
    cursor.setAttribute('visibility', 'visible');
    cursor.querySelector('line').setAttribute('x1', x); cursor.querySelector('line').setAttribute('x2', x);
    cursor.querySelector('circle').setAttribute('cx', x); cursor.querySelector('circle').setAttribute('cy', Y(p[1]));
    const since = i > 0 && i < series.length - 1 ? p[0] : pts[Math.max(0, Math.min(i, pts.length - 1))][0];
    tip.innerHTML = `<b>${money(p[1], cur)}</b> ${i > 0 && i < series.length - 1 ? delta(prev[1], p[1]) : ''}<br>${esc(fmtDate(t, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))}${p[2] === false ? ' · agotado' : ''}<br><span style="opacity:.7">desde ${esc(day(since))}</span>`;
    tip.hidden = false;
    tip.style.left = `${Math.min(Math.max(x, tip.offsetWidth / 2), W - tip.offsetWidth / 2)}px`;
    tip.style.top = `${Math.max(0, Y(p[1]) - tip.offsetHeight - 14)}px`;

// ---------- list
function matches(w) {
  if (query && !`${w.title || ''} ${w.url} ${w.tag}`.toLowerCase().includes(query)) return false;
  if (filter === 'all') return true;
  if (filter === 'drops') return w.spark?.length > 1 && w.spark.at(-1)[1] < w.spark.at(-2)[1];
  if (filter === 'problem') return w.status === 'blocked' || w.status === 'error';

}
function renderFilters() {

  const count = f => watches.filter(w => { const [q, fl] = [query, filter]; query = ''; filter = f; const m = matches(w); query = q; filter = fl; return m; }).length;
  const items = [['all', 'Todo'], ['drops', 'Bajaron'], ['problem', 'Con problemas'], ...tags.map(t => ['tag:' + t, t])].map(([k, l]) => [k, l, count(k)]);
  if (!items.some(i => i[0] === filter && (i[2] || i[0] === 'all'))) filter = 'all';
  const chips = items.filter(i => i[0] === 'all' || i[2]).map(([k, label, n]) => `<button class="chip" data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(label)}<b>${n}</b></button>`).join('');
  const search = watches.length > 6 ? `<input class="search" id="search" type="search" placeholder="Buscar" value="${esc(query)}" aria-label="Buscar">` : '';
  if (!$('#search') || !search) $('#filters').innerHTML = watches.length < 2 ? '' : search + chips;
  else [...$('#filters').querySelectorAll('.chip')].forEach(c => c.remove()), $('#filters').insertAdjacentHTML('beforeend', chips);
}
function renderRow(w) {
  const sp = w.spark || [], prev = sp.length > 1 ? sp.at(-2)[1] : null;
  const checking = busy.has(w.id) || w.status === 'new';
  let value;
  if (w.price != null) value = `<div class="price">${money(w.price, w.currency)}</div><div class="sub">${delta(prev, w.price)}${w.in_stock === false ? stock(w) : ''}</div>`;
  else if (w.status === 'ok') value = `<div class="sub">${w.changes ? `<span class="badge warn">${w.changes} ${w.changes === 1 ? 'cambio' : 'cambios'}</span>` : '<span class="badge plain">Sin cambios</span>'}</div>`;
  else if (w.status === 'blocked') value = '<div class="sub"><span class="badge warn">Bloqueado</span></div>';
  else if (w.status === 'error') value = '<div class="sub"><span class="badge bad">Error</span></div>';
  else value = `<div class="sub"><span class="badge plain">${checking ? 'Revisando…' : 'Pendiente'}</span></div>`;
  const why = w.error ? `<div class="why ${esc(w.status)}">${esc(w.error)}</div>` : '';
  return `<button class="row ${w.paused ? 'paused' : ''}" data-id="${esc(w.id)}">
    ${thumb(w)}
    <div style="min-width:0">
      <div class="name">${esc(w.title || w.url)}</div>
      <div class="meta"><span class="host">${esc(host(w.url))}</span>${w.tag ? `<span class="tag">${esc(w.tag)}</span>` : ''}<span>· ${w.paused ? 'en pausa' : esc(ago(w.checked_at))}</span></div>
      ${why}

}
function render() {
  renderFilters();
  const shown = watches.filter(matches);
  $('#list').innerHTML = shown.length ? shown.map(renderRow).join('') : `<div class="empty">${watches.length ? 'Nada coincide.' : 'Todavía no vigilas nada. Pega la URL de un producto o de cualquier página.'}</div>`;
}
async function load() {
  watches = await api('/watches');

// ---------- detail
async function openDetail(id, keepRange) {

  openId = id; openWatch = w;
  if (!keepRange) range = w.prices.length && w.prices.at(-1)[0] - w.prices[0][0] > 400 * DAY ? 'd365' : 'all';
  $('#detail-title').textContent = host(w.url);
  const hist = w.history;
  const prevPrice = w.prices.length > 1 ? w.prices.at(-2)[1] : null;
  const histRows = hist.map((h, i) => {
    const older = hist[i + 1];
    if (h.text) return `<tr><td class="when">${esc(when(h.at))}</td><td>${older ? 'Cambió el texto' : 'Primera versión'}</td><td><button class="link-btn" data-diff="${h.id}">${older ? 'Ver cambios' : 'Ver texto'}</button></td></tr><tr hidden><td colspan="3" style="padding:0"></td></tr>`;
    return `<tr><td class="when">${esc(when(h.at))}</td><td><b>${money(h.price, h.currency)}</b> ${older ? delta(older.price, h.price) : ''}</td><td>${stock(h)}</td></tr>`;

  const n = w.notify;

    <div class="hero">${thumb(w)}<div style="min-width:0"><h1>${esc(w.title || host(w.url))}</h1><a href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">${esc(host(w.url))} · abrir ↗</a></div></div>
    ${w.price != null ? `<div class="big">${money(w.price, w.currency)}</div>` : ''}

    ${w.error ? `<div class="why ${esc(w.status)}" style="margin-top:8px;font-size:14px">${esc(w.error)}</div>` : ''}
    <div class="actions">
      <button class="btn primary" data-dact="check">${ICON.refresh} Revisar ahora</button>
      <button class="btn" data-dact="pause">${w.paused ? 'Reanudar' : 'Pausar'}</button>
      <button class="btn danger" data-dact="delete">Eliminar</button>

      <div class="ranges" role="group" aria-label="Periodo">${RANGES.map(([k, l]) => `<button data-range="${k}" aria-pressed="${range === k}">${l}</button>`).join('')}</div>

      <div class="stats" id="stats"></div>
    </div>` : ''}

          <label class="field">Sólo esta parte (selector CSS) <input name="selector" value="${esc(w.selector || '')}" placeholder="toda la página" spellcheck="false" autocapitalize="off"></label>

function drawRange() {
  const w = openWatch, [, , days] = RANGES.find(r => r[0] === range);

  drawChart($('#chart'), w.prices, days, w.currency);
  const s = w.stats[range];
  if (!s) { $('#stats').innerHTML = ''; return; }
  const vsMin = w.price != null && s.min ? (w.price - s.min) / s.min * 100 : null;
  $('#stats').innerHTML = `
    <div class="stat"><span>Mínimo</span><b>${money(s.min)}</b><i>${esc(day(s.min_at))}</i></div>
    <div class="stat"><span>Máximo</span><b>${money(s.max)}</b><i>${esc(day(s.max_at))}</i></div>
    <div class="stat"><span>Promedio</span><b>${money(Math.round(s.avg))}</b><i>ponderado por tiempo</i></div>
    <div class="stat"><span>Cambios</span><b>${s.changes}</b><i>${vsMin == null ? '' : vsMin < 0.05 ? 'hoy está en su mínimo' : `${num(vsMin, 1)}% sobre el mínimo`}</i></div>`;

function intervalOptions(sel) {

  return opts.map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('');
}
async function showDiff(btn) {
  const holder = btn.closest('tr').nextElementSibling;
  if (!holder.hidden) { holder.hidden = true; return; }
  try {
    const d = await api(`/watches/${openId}/snapshots/${btn.dataset.diff}/diff`);
    const cls = { '+': 'add', '-': 'del', '@': 'gap' };
    holder.firstElementChild.innerHTML = `<div class="diff">${d.first ? `<div>${esc(d.text)}</div>` : d.lines.map(l => `<div class="${cls[l.t] || ''}">${l.t === '@' ? '⋯' : esc(l.s) || '&nbsp;'}</div>`).join('')}</div>`;
    holder.hidden = false;
  } catch (e) { toast(e.message); }
}
async function act(id, what) {
  const w = watches.find(x => x.id === id) || openWatch;
  try {
    if (what === 'check') {
      busy.add(id); render();
      const r = await api(`/watches/${id}/check`, { method: 'POST' });
      toast(r.watch.status !== 'ok' ? r.watch.error : r.changed ? 'Cambió desde la última vez' : 'Sin cambios');
    } else if (what === 'pause') {
      await api(`/watches/${id}`, { method: 'PATCH', body: { paused: !w.paused } });
    } else if (what === 'delete') {
      if (!confirm(`¿Eliminar «${w.title || w.url}» y todo su historial?`)) return;
      await api(`/watches/${id}`, { method: 'DELETE' });
      $('#detail').close();
    }
  } catch (e) { toast(e.message); }
  busy.delete(id);
  await load();
  if (openId === id && what !== 'delete') openDetail(id, true);
}

// ---------- notifications on this device
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

async function disablePush() {
  const sub = await pushSub();
  if (sub) { await api('/push/unsubscribe', { method: 'POST', body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
}
async function renderBell() {
  const s = await pushState();
  $('#bell').innerHTML = (s === 'on' ? ICON.bellOn + '<span class="badge-dot"></span>' : ICON.bellOff);
  $('#bell').title = { on: 'Avisos activados en este dispositivo', off: 'Activar avisos en este dispositivo', denied: 'El navegador bloqueó los avisos', ios: 'Instala la app para recibir avisos', unsupported: 'Este navegador no recibe avisos' }[s];
  return s;
}
async function bellClick() {
  const s = await pushState();
  try {
    if (s === 'off') { await enablePush(); toast('Listo: te aviso aquí cuando algo cambie'); }
    else if (s === 'on') return openSettings();
    else if (s === 'ios') toast('En iPhone: Compartir → Agregar a inicio, abre Vigía desde ahí y activa los avisos.');
    else if (s === 'denied') toast('El navegador bloqueó los avisos de este sitio. Permítelos en sus ajustes.');
    else toast('Este navegador no puede recibir avisos.');
  } catch (e) { toast(e.message); }
  renderBell(); load().catch(() => {});
}

// ---------- settings
async function openSettings() {
  let s;
  try { [s, status] = await Promise.all([api('/settings'), api('/status')]); } catch (e) { return toast(e.message); }
  const o = location.origin, ps = await pushState();
  const pushLine = { on: '<span class="dot on"></span>Activados en este dispositivo', off: '<span class="dot"></span>Apagados en este dispositivo', denied: '<span class="dot off"></span>El navegador los bloqueó para este sitio', ios: '<span class="dot"></span>En iPhone se activan desde la app instalada', unsupported: '<span class="dot off"></span>Este navegador no los admite' }[ps];
  $('#settings-body').innerHTML = `
    <div class="card"><h3>Avisos en el teléfono</h3>
      <div class="status-line">${pushLine}</div>
      <div class="hint">Llegan a ${status.devices || 0} ${status.devices === 1 ? 'dispositivo' : 'dispositivos'}. Qué los dispara se elige en cada vigilancia.${isIOS && !standalone ? ' En iPhone: Compartir → Agregar a inicio y abre Vigía desde ese ícono.' : ''}</div>
      <div class="row-btns">
        ${ps === 'off' ? '<button class="btn small primary" id="push-on">Activar aquí</button>' : ''}
        ${ps === 'on' ? '<button class="btn small" id="push-test">Enviar prueba</button><button class="btn small" id="push-off">Apagar aquí</button>' : ''}
        ${installPrompt ? '<button class="btn small" id="install2">Instalar app</button>' : ''}
      </div>
    </div>
    <div class="card"><h3>Webhook</h3>
      <div class="hint">Cada cambio se envía como POST con JSON (n8n, Zapier, tu servicio).</div>
      <form id="hook-form"><label class="field">URL <input name="webhook_url" type="url" value="${esc(s.webhook_url)}" placeholder="https://…" autocapitalize="off"></label>
      <div class="row-btns"><button class="btn small">Guardar</button><button class="btn small" type="button" id="hook-test">Probar</button></div></form>
    </div>
    <div class="card"><h3>Revisión</h3>
      <form id="check-form"><div class="grid2">
        <label class="field">Intervalo para vigilancias nuevas <select name="default_interval">${intervalOptions(+s.default_interval || 3600)}</select></label>
        <label class="field">User-Agent <input name="user_agent" value="${esc(s.user_agent)}" placeholder="${esc(s.default_user_agent)}" spellcheck="false" autocapitalize="off"></label>
      </div><div class="hint">Si una revisión falla, la siguiente espera el doble (hasta un día). Nunca se piden dos páginas del mismo sitio a la vez.</div><button class="btn small">Guardar</button></form>
    </div>
    <div class="card"><h3>Relevo</h3>
      <div class="hint">Para sitios que rechazan la IP del servidor: un Worker de Cloudflare pide la página desde su red. Sólo obedece peticiones firmadas por este servidor; el código ya trae su clave pública.</div>
      <form id="relay-form"><label class="field">URL del Worker <input name="relay_url" type="url" value="${esc(s.relay_url)}" placeholder="https://vigia-relay.….workers.dev" autocapitalize="off"></label>
      <div class="row-btns"><button class="btn small">Guardar</button><button class="btn small" type="button" id="relay-code">Copiar código del Worker</button></div></form>
    </div>
    <div class="card"><h3>Tus datos</h3>
      <div class="hint">Base de ${status.db_kb ?? '?'} KB. Los precios se guardan sólo cuando cambian y nunca se borran; de las páginas de texto se guardan las últimas 50 versiones, comprimidas.</div>
      <div class="row-btns"><a class="btn small" href="/api/export/prices.csv" download>Precios (CSV)</a><a class="btn small" href="/api/backup" download>Respaldo completo</a></div>
    </div>
    <div class="card"><h3>API y MCP</h3>
      <pre class="code" id="api-help"># Vigilar una URL (responde ya con precio y existencias)
curl -X POST ${esc(o)}/api/watches -H "Authorization: Bearer $VIGIA_TOKEN" \\
  -H "content-type: application/json" -d '{"url":"https://…","notify":"drop"}'

# Servidor MCP para asistentes de IA
${esc(o)}/mcp</pre>
      <div class="row-btns"><button class="btn small" data-copy="#api-help">Copiar</button></div>
    </div>
    <div class="row-btns" style="align-items:center"><span class="hint" style="margin:0;flex:1">Vigía ${esc(status.version || '')} · ${status.rss_kb ? `${(status.rss_kb / 1024).toFixed(1)} MB de memoria` : ''}</span><button class="btn small" id="logout">Cerrar sesión</button></div>`;
  if (!$('#settings').open) $('#settings').showModal();
}
async function saveSettings(form) {
  try { await api('/settings', { method: 'PUT', body: Object.fromEntries(new FormData(form)) }); toast('Guardado'); } catch (e) { toast(e.message); }
}

// ---------- adding
function urlsIn(text) {
  const found = text.match(/https?:\/\/[^\s"'<>]+/g);
  return found ? [...new Set(found)] : text.trim() ? [text.trim()] : [];
}
$('#add-url').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = `${t.scrollHeight}px`; });
$('#add-url').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#add-form').requestSubmit(); } });
$('#add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#add-btn'), urls = urlsIn($('#add-url').value);
  if (!urls.length) return;
  btn.disabled = true;
  const extra = { interval: +$('#add-interval').value };
  if ($('#add-tag').value.trim()) extra.tag = $('#add-tag').value;
  if ($('#add-selector').value.trim()) extra.selector = $('#add-selector').value;
  let ok = 0, last = null;
  for (const [i, url] of urls.entries()) {
    btn.textContent = urls.length > 1 ? `${i + 1} de ${urls.length}…` : 'Revisando…';
    try { last = await api('/watches', { method: 'POST', body: { url, ...extra } }); ok++; } catch (err) { toast(`${host(url)}: ${err.message}`); }
    load().catch(() => {});
  }
  $('#add-url').value = ''; $('#add-url').style.height = '';
  btn.disabled = false; btn.textContent = 'Vigilar';
  if (urls.length > 1) toast(`${ok} de ${urls.length} agregadas`);
  else if (last) toast(last.existing ? 'Esa URL ya estaba vigilada' : last.status === 'ok' ? (last.price != null ? `Vigilando: ${host(last.url)} a $${num(last.price, 0)}` : 'Vigilando') : last.error);
});

// ---------- wiring
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; document.querySelectorAll('dialog[open]').forEach(d => d.close()); $('#login-token').focus(); }
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  try { await api('/login', { method: 'POST', body: { token: $('#login-token').value } }); $('#login-token').value = ''; start(); } catch (err) { toast(err.message); }
});
$('#toggle-more').addEventListener('click', () => { $('#add-more').hidden = !$('#add-more').hidden; });
$('#filters').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; render(); } });
$('#filters').addEventListener('input', e => { if (e.target.id === 'search') { query = e.target.value.trim().toLowerCase(); render(); } });
$('#list').addEventListener('click', e => { const row = e.target.closest('.row'); if (row) { history.pushState({ w: row.dataset.id }, '', `#w=${row.dataset.id}`); openDetail(row.dataset.id); } });
$('#open-settings').addEventListener('click', openSettings);
$('#bell').addEventListener('click', bellClick);
document.addEventListener('click', async e => {
  const t = e.target, c = sel => t.closest(sel);
  if (c('[data-close]')) c('dialog').close();
  else if (c('[data-dact]')) act(openId, c('[data-dact]').dataset.dact);
  else if (c('[data-range]')) { range = c('[data-range]').dataset.range; drawRange(); }
  else if (c('[data-diff]')) showDiff(c('[data-diff]'));
  else if (c('[data-more]')) { const tb = c('tbody'); tb.nextElementSibling.hidden = false; c('tr').remove(); }
  else if (c('[data-copy]')) { await navigator.clipboard.writeText($(c('[data-copy]').dataset.copy).textContent).catch(() => {}); toast('Copiado'); }
  else if (t.id === 'push-on') { try { await enablePush(); toast('Avisos activados'); } catch (err) { toast(err.message); } renderBell(); openSettings(); }
  else if (t.id === 'push-off') { await disablePush(); renderBell(); openSettings(); }
  else if (t.id === 'push-test') { try { const r = await api('/push/test', { method: 'POST' }); toast(`Enviado a ${r.delivered} ${r.delivered === 1 ? 'dispositivo' : 'dispositivos'}`); } catch (err) { toast(err.message); } }
  else if (t.id === 'install' || t.id === 'install2') { installPrompt?.prompt(); }
  else if (t.id === 'hook-test') { try { await api('/settings', { method: 'PUT', body: { webhook_url: t.form.webhook_url.value } }); await api('/settings/webhook-test', { method: 'POST' }); toast('El webhook respondió bien'); } catch (err) { toast(err.message); } }
  else if (t.id === 'relay-code') { try { const code = await (await fetch('/api/relay/worker.js')).text(); await navigator.clipboard.writeText(code); toast('Código copiado: pégalo en un Worker nuevo'); } catch (err) { toast(err.message); } }
  else if (t.id === 'logout') { await api('/logout', { method: 'POST' }).catch(() => {}); showLogin(); }
});
document.addEventListener('change', async e => {
  const f = e.target.form;
  if (f?.id !== 'notify-form') return;
  const notify = f.querySelector('input[name=notify]:checked')?.value;
  if (notify === 'below' && !f.target.value.trim()) { f.target.focus(); return; }
  try { await api(`/watches/${openId}`, { method: 'PATCH', body: { notify, target: f.target?.value ?? null } }); toast('Guardado'); openWatch.notify = notify; } catch (err) { toast(err.message); }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'edit-form') {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)); d.interval = +d.interval;
    try { await api(`/watches/${openId}`, { method: 'PATCH', body: d }); toast('Guardado'); await load(); openDetail(openId, true); } catch (err) { toast(err.message); }
  } else if (f.id === 'notify-form') { e.preventDefault(); }
  else if (['hook-form', 'check-form', 'relay-form'].includes(f.id)) { e.preventDefault(); saveSettings(f); }
});
$('#detail').addEventListener('close', () => { openId = null; openWatch = null; if (location.hash.startsWith('#w=')) history.replaceState(null, '', location.pathname); });
window.addEventListener('popstate', () => { if (!location.hash.startsWith('#w=') && $('#detail').open) $('#detail').close(); });
new ResizeObserver(() => { if (openWatch?.prices.length && $('#chart')) drawRange(); }).observe(document.body);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('#install').hidden = false; });
window.addEventListener('appinstalled', () => { installPrompt = null; $('#install').hidden = true; });
navigator.serviceWorker?.addEventListener('message', e => { const m = /#w=(\w+)/.exec(e.data?.open || ''); if (m) openDetail(m[1]); });

async function start() {
  $('#add-interval').innerHTML = intervalOptions(3600);
  try {
    await load();
    $('#login').hidden = true; $('#app').hidden = false;
    api('/settings').then(s => { $('#add-interval').innerHTML = intervalOptions(+s.default_interval || 3600); }).catch(() => {});
    const m = /#w=(\w+)/.exec(location.hash);
    if (m) openDetail(m[1]);
    // Re-register an existing subscription in case the server lost it (new database, new key).
    if ((await renderBell()) === 'on') enablePush().catch(() => {});
  } catch {}
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
setInterval(() => { if (!document.hidden && !$('#app').hidden && !document.querySelector('dialog[open]')) load().catch(() => {}); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden) load().catch(() => {}); });
start();
</script>
</body>
