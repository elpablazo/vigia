name: Publish

# Every push to main: test, build the image, push it to ghcr.io and point the `deploy` branch at it.
# A server that follows `deploy` (Coolify, etc.) then redeploys without compiling anything.
# A tag vX.Y.Z additionally creates a GitHub Release with the static binary.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # update the deploy branch, create releases
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"

      - name: Build image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}" .

      - name: Push image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

      - name: Point the deploy branch at this image
        if: github.ref == 'refs/heads/main'
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")
          mkdir deploy-branch && cd deploy-branch && git init -q -b deploy
          printf '# Generated by the Publish workflow from commit %s. Do not edit.\nFROM %s\n' "$GITHUB_SHA" "$digest" > Dockerfile
          git add Dockerfile
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Deploy ${GITHUB_SHA::12}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy

      - name: Extract binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          id=$(docker create "$IMAGE:latest")
          docker cp "$id:/vigia" vigia-x86_64-linux
          docker rm "$id"
          sha256sum vigia-x86_64-linux > vigia-x86_64-linux.sha256
          docker tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME#v}"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: vigia-x86_64-linux

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" vigia-x86_64-linux vigia-x86_64-linux.sha256 --generate-notes
